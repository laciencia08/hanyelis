<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¡Viajeros del Tiempo! — Santa Rosa</title><style>:root{font-family:system-ui,'Segoe UI',sans-serif;color:#17324d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#d8f4ff,#fff2ca);min-height:100vh}.wrap{max-width:950px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:700}.badge{background:white;border-radius:22px;padding:9px 15px;box-shadow:0 4px 12px #0001}.track{height:12px;background:#fff;border-radius:20px;margin:14px 0 25px;overflow:hidden}.bar{height:100%;width:0;background:#22ae83;transition:.3s}main{background:#fffefa;border:4px solid #fff;border-radius:30px;min-height:560px;padding:28px;box-shadow:0 14px 40px #35557725;text-align:center}h1{font-size:clamp(29px,5vw,51px);margin:10px 0;color:#124a82}h2{font-size:clamp(25px,4vw,39px);color:#145e83;margin:8px 0 15px}p{font-size:clamp(17px,2.3vw,23px);line-height:1.55;max-width:750px;margin:14px auto}.art{font-size:clamp(72px,13vw,130px);margin:10px 0;line-height:1.3}.small{font-size:16px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px;max-width:760px;margin:25px auto}.opt,button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:15px 22px;font-size:19px;font-weight:700}.opt{background:#e8f5ff;border:3px solid #8dd3ff;color:#174a71}.opt:hover{background:#ccecff}.opt:disabled{opacity:.8;cursor:default}.opt.correct{background:#c6f5da;border-color:#2baf69}.opt.wrong{background:#ffe0dc;border-color:#d85847}.nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}.primary{background:#ffb62c;color:#442c00;box-shadow:0 5px 0 #d48b08}.secondary{background:#dceef8;color:#174a71}.feedback{min-height:42px;font-size:22px;font-weight:800}.good{color:#16834b}.bad{color:#b84036}.hidden{display:none}.foot{text-align:center;padding:18px;font-size:14px;color:#36556b} .spark{background:#fff0b6;border-radius:18px;padding:12px;margin:20px auto;max-width:650px}@media(max-width:600px){main{padding:17px;min-height:570px}.wrap{padding:10px}.art{font-size:74px}} .choice-image{display:block;font-size:74px;line-height:1.4}.opt span:last-child{display:block} .opt:focus-visible{outline:4px solid #ffae00}</style></head><body><div class="wrap"><div class="top"><span class="badge">⏳ Misión <span id="num">1</span> de <span id="total">20</span></span><span class="badge">⭐ Puntos: <span id="score">0</span></span></div><div class="track"><div class="bar" id="bar"></div></div><main id="screen" aria-live="polite"></main><div class="foot">Centro Educativo Santa Rosa · Distrito 12-03 · Docente: Hanyelis Santana Rijo · 4.º de primaria · Ciencias Sociales</div></div><script>
const slides=[
{title:'¡VIAJEROS DEL TIEMPO!',art:'🏫 ⏳ 🏝️',text:'<strong>Centro Educativo:</strong> Santa Rosa<br><strong>Distrito Educativo:</strong> 12-03<br><strong>Docente:</strong> Hanyelis Santana Rijo<br><strong>Grado:</strong> 4.º de primaria<br><strong>Área curricular:</strong> Ciencias Sociales<br><strong>Herramienta digital:</strong> Padlet',button:'🚀 ¡Iniciar aventura!'},
{title:'🎯 Propósito de aprendizaje',art:'📚 🌟 🧭',text:'Desarrollar en los estudiantes de 4.º grado del Nivel Primario la comprensión de los primeros pobladores de la isla de Santo Domingo, mediante la identificación de sus características socioculturales, formas de organización y actividades económicas, utilizando recursos digitales interactivos que favorezcan el pensamiento crítico, la participación activa y la construcción de aprendizajes significativos.',button:'¡Conozcamos el tema!'},
{title:'Viajamos al pasado',art:'🛶 🌊 🌴',text:'<strong>Tema: Descubriendo cómo vivían los primeros pobladores de la isla de Santo Domingo.</strong><br>¡Viaja en el tiempo para conocer sus viviendas, alimentos, trabajos y medios de transporte!',button:'¡Viajar al pasado!'},
{title:'Nuestra misión',art:'🧭 🗺️ ⭐',text:'Serás un explorador. Lee las pistas y supera desafíos de verdadero o falso y selección de imágenes. Cada respuesta correcta suma un punto. ¡Cada desafío trata un conocimiento diferente!',button:'¡Estoy listo!'},
{title:'¿Quiénes vivían aquí?',art:'🏝️ 👨🏽‍🌾 👩🏽‍🌾',text:'Antes de la llegada de los europeos, la isla estaba habitada por pueblos indígenas. Entre ellos estaban los taínos, ciguayos y macorixes.',button:'Seguir explorando'},
{title:'¿Cómo llegaron?',art:'🌊 🛶 🌴',text:'Grupos de pobladores llegaron navegando desde otras regiones del Caribe. Las canoas les permitían desplazarse por el mar y los ríos.',button:'Seguir explorando'},
{title:'¿Dónde vivían?',art:'🛖 🌿 🛖',text:'Vivían en comunidades y construían viviendas con madera, hojas de palma y otros materiales naturales. Algunas se llamaban bohíos y caneyes.',button:'Seguir explorando'},
{title:'¿Qué comían?',art:'🌽 🐟 🌱',text:'Cultivaban yuca y maíz, pescaban y recolectaban alimentos. Con la yuca elaboraban casabe.',button:'Seguir explorando'},
{title:'¿A qué se dedicaban?',art:'🎣 🧺 🛶',text:'Practicaban la agricultura y la pesca. También fabricaban canoas, cestas y herramientas para su vida diaria.',button:'¡A los desafíos!'},
{"title": "Desafío 1 · Selección múltiple", "art": "🏝️", "text": "¿Cómo se llamaban algunos de los primeros habitantes de la isla?", "options": ["Taínos", "Romanos", "Egipcios"], "answer": 0, "explain": "¡Correcto! Los taínos fueron uno de los pueblos originarios."},
{"title": "Desafío 2 · Selecciona la imagen", "art": "🛖", "text": "¿Cómo se llamaban muchas de las viviendas taínas?", "options": ["🏰|Castillos", "🛖|Bohíos", "🏢|Apartamentos"], "answer": 1, "explain": "¡Correcto! Muchas viviendas taínas se llamaban bohíos."},
{"title": "Desafío 3 · Selecciona la imagen", "art": "🛶", "text": "¿Qué utilizaban los taínos para navegar?", "options": ["✈️|Aviones", "🛶|Canoas", "🚂|Trenes"], "answer": 1, "explain": "¡Correcto! Usaban canoas para viajar por el agua."},
{"title": "Desafío 4 · Selecciona la imagen", "art": "🏺", "text": "¿Con qué material fabricaban algunos objetos?", "options": ["🧴|Plástico", "🏺|Barro", "🪟|Vidrio"], "answer": 1, "explain": "¡Correcto! Fabricaban vasijas y otros objetos con barro."},
{"title": "Desafío 5 · Selecciona la imagen", "art": "🔥", "text": "¿Qué utilizaban para cocinar sus alimentos?", "options": ["📦|Microondas", "🔥|Fuego", "🔌|Estufa eléctrica"], "answer": 1, "explain": "¡Correcto! Cocinaban sus alimentos con fuego."},
{"title": "Desafío 6 · Selección múltiple", "art": "🌽", "text": "¿Qué actividad consistía en sembrar yuca y maíz?", "options": ["Agricultura", "Navegación", "Construcción"], "answer": 0, "explain": "¡Correcto! La agricultura es el cultivo de la tierra."},
{"title": "Desafío 7 · Verdadero o falso", "art": "🥖", "text": "Los taínos elaboraban casabe a partir de la yuca.", "options": ["Verdadero", "Falso"], "answer": 0, "explain": "¡Correcto! El casabe es un alimento elaborado con yuca."},
{"title": "Desafío 8 · Verdadero o falso", "art": "🏘️", "text": "Los taínos vivían en comunidades llamadas yucayeques.", "options": ["Verdadero", "Falso"], "answer": 0, "explain": "¡Correcto! Sus comunidades eran conocidas como yucayeques."},
{"title": "Desafío 9 · Selección múltiple", "art": "👑", "text": "¿Cómo se llamaba el líder de una comunidad taína?", "options": ["Cacique", "Emperador romano", "Alcalde"], "answer": 0, "explain": "¡Correcto! El cacique dirigía la comunidad."},
{"title": "Desafío 10 · Selecciona la imagen", "art": "🌴", "text": "¿Qué material utilizaban para techar algunas viviendas?", "options": ["🌴|Hojas de palma", "💻|Pantallas", "🚗|Piezas de automóvil"], "answer": 0, "explain": "¡Correcto! Las hojas de palma se usaban para techar viviendas."},
{"title": "Desafío 11 · Verdadero o falso", "art": "🤝", "text": "Los pueblos originarios tenían costumbres y tradiciones propias.", "options": ["Verdadero", "Falso"], "answer": 0, "explain": "¡Correcto! Los pueblos originarios tenían su propia cultura."},
{"title": "Desafío 12 · Selección múltiple", "art": "🔎", "text": "¿Cómo podemos conocer la vida de los primeros pobladores?", "options": ["Estudiando sus objetos y costumbres", "Observando autos modernos", "Usando celulares"], "answer": 0, "explain": "¡Correcto! Los restos materiales y las tradiciones nos ayudan a conocer el pasado."},
{title:'¡MISIÓN CUMPLIDA!',art:'🏆 🎉 ⭐',text:'¡Felicidades, explorador! Has descubierto cómo vivían los primeros pobladores de nuestra isla.',finish:true}
];let current=0,score=0,answered={};const screen=document.getElementById('screen');function render(){let s=slides[current];document.getElementById('num').textContent=current+1;document.getElementById('total').textContent=slides.length;document.getElementById('score').textContent=score;document.getElementById('bar').style.width=((current+1)/slides.length*100)+'%';let html=`<h${current===0?1:2}>${s.title}</h${current===0?1:2}><div class="art" aria-hidden="true">${s.art}</div><p>${s.text}</p>`;if(s.options){html+='<div class="options">'+s.options.map((o,i)=>`<button class="opt ${answered[current]!==undefined?(i===s.answer?'correct':i===answered[current]?'wrong':''):''}" ${answered[current]!==undefined?'disabled':''} onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o.includes('|')?'<span class="choice-image">'+o.split('|')[0]+'</span><span>'+o.split('|')[1]+'</span>':o}</button>`).join('')+'</div><div class="feedback '+(answered[current]===s.answer?'good':'bad')+'">'+(answered[current]===undefined?'Elige una respuesta para continuar.':answered[current]===s.answer?s.explain:'¡Buen intento! La respuesta correcta es: '+s.options[s.answer].replace('|',' — ')+'.')+'</div>'}if(s.finish){html+=`<div class="spark">⭐ Lograste <strong>${score} de ${slides.filter(x=>x.options).length} puntos</strong> en los desafíos.<br>¿Qué aprendiste sobre la vivienda, la alimentación y los viajes en canoa?</div>`}html+='<div class="nav">';if(current>0)html+='<button class="secondary" onclick="prev()">← Anterior</button>';if(s.finish)html+='<button class="primary" onclick="restart()">🔄 Jugar otra vez</button>';else html+=`<button class="primary" onclick="next()" ${s.options&&answered[current]===undefined?'disabled style="opacity:.45;cursor:not-allowed"':''}>${s.button||'Continuar →'}</button>`;html+='</div>';screen.innerHTML=html}function choose(i){if(answered[current]!==undefined)return;answered[current]=i;if(i===slides[current].answer)score++;render()}function next(){if(slides[current].options&&answered[current]===undefined)return;if(current<slides.length-1){current++;render()}}function prev(){if(current>0){current--;render()}}function restart(){current=0;score=0;answered={};render()}render();
</script></body></html>
